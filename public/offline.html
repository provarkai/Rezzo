<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REZZO — You're offline</title>
<style>
  :root {
    --navy: #102A43;
    --green: #1F7A5A;
    --bg: #F7F9FB;
    --text-secondary: #52606D;
    --border: #D9E2EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--navy);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 360px; }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, #102A43 0%, #1A3A5C 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 8px 20px rgba(16, 42, 67, 0.2);
  }
  .mark span { color: #fff; font-weight: 700; font-size: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin: 0 0 20px; }
  button {
    height: 44px;
    padding: 0 24px;
    border-radius: 12px;
    border: none;
    background: var(--navy);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #071A2B; }
  .hint { margin-top: 16px; font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><span>R</span></div>
    <h1>You're offline</h1>
    <p>REZZO needs a connection to load cases, quotes, and messages — this page is cached so it isn't a blank screen while you reconnect.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="hint">Already viewed a case recently? Go back — that page may load from cache.</p>
  </div>
</body>
</html>
